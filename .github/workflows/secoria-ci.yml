name: Secoria Security & Code Quality Gate

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

jobs:
  secoria-audit:
    name: Secoria Multi-Agent Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CI Runner Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run Secoria CI Security Gate
        env:
          SECORIA_API_URL: ${{ secrets.SECORIA_API_URL || 'http://localhost:8000' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python backend/scripts/secoria_ci.py \
            --api-url "$SECORIA_API_URL" \
            --fail-on critical \
            --min-score 70
